<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teach-anything · 学习站</title>
<style>
:root {
  --ink: #1f1c18;
  --ink-soft: #5e574e;
  --ink-faint: #6f675d;
  --paper: #fbf8f3;
  --rule-soft: #ebe4d9;
  --accent: #8a4b2a;
  --measure: 42rem;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-body: 1.0625rem;
  --text-lg: 1.25rem;
  --text-xl: 2.1rem;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  padding: 3.5rem 1.25rem 6rem;
  background: var(--paper);
  color: var(--ink);
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
    "Songti SC", "Noto Serif SC", serif;
  font-size: var(--text-body);
  line-height: 1.8;
  font-kerning: normal;
}

.wrap {
  max-width: var(--measure);
  margin: 0 auto;
}

.kicker {
  margin: 0 0 0.5rem;
  font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif;
  font-size: var(--text-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

h1 {
  margin: 0;
  font-size: clamp(1.7rem, 2.2vw + 1rem, var(--text-xl));
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.subtitle {
  margin: 0.35rem 0 0;
  font-size: var(--text-lg);
  color: var(--ink-soft);
}

section {
  margin-top: 3rem;
}

h2 {
  margin: 0 0 1rem;
  font-size: var(--text-lg);
  font-weight: 600;
  letter-spacing: 0.01em;
}

h2 .num {
  margin-right: 0.5rem;
  font-family: "Helvetica Neue", Arial, sans-serif;
  font-size: var(--text-sm);
  color: var(--accent);
  vertical-align: 0.15em;
}

p {
  margin: 0 0 1rem;
}

a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.link-list {
  margin: 1rem 0;
  padding: 0;
  list-style: none;
}

.link-list li {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.3rem 0.8rem;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--rule-soft);
}

.link-list li:last-child {
  border-bottom: 0;
}

.link-list a {
  display: inline-flex;
  align-items: center;
  min-height: 2.5rem;
  padding: 0.25rem 0;
}

.link-list span {
  font-size: var(--text-sm);
  color: var(--ink-faint);
}

footer {
  margin-top: 4rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--rule-soft);
  font-size: var(--text-sm);
  color: var(--ink-soft);
}

@media (max-width: 34rem) {
  body {
    padding: 2rem 1rem 4rem;
    font-size: 1rem;
  }

  .link-list a {
    min-height: 2.75rem;
  }
}
</style>
</head>
<body>
<main class="wrap">

  <p class="kicker">teach-anything · 学习站</p>
  <h1>课程目录</h1>
  <p class="subtitle">按学习方向进入</p>

  <section>
    <h2><span class="num">01</span>游戏笔记</h2>
    <ul class="link-list">
      <li>
        <a href="oxygen-notes/index.html">oxygen-notes</a>
        <span>《缺氧》建造模块笔记 · 数据驱动 · 边玩边记</span>
      </li>
    </ul>
  </section>

  <footer>
    <p>新增课程时，在对应分组追加一行，并把课程目录加入部署脚本。</p>
  </footer>

</main>
</body>
</html>
