<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oxygen-notes · 《缺氧》建造笔记</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header" id="page-header">
  <div class="header-inner">
    <div class="brand">
      <span class="logo">O₂</span>
      <div>
        <h1>oxygen-notes</h1>
        <p class="tagline">《缺氧》建造模块笔记</p>
      </div>
    </div>
    <div class="header-meta">
      <span id="module-count">--</span> 个模块
    </div>
  </div>
</header>

<nav class="filter-bar" id="category-filter">
  <button class="filter-btn active" data-cat="all">全部</button>
  <button class="filter-btn" data-cat="oxygen">氧气</button>
  <button class="filter-btn" data-cat="power">电力</button>
  <button class="filter-btn" data-cat="farming">农业/食物</button>
  <button class="filter-btn" data-cat="industry">工业</button>
  <button class="filter-btn" data-cat="energy">能源/燃料</button>
  <button class="filter-btn" data-cat="temperature">温控</button>
  <button class="filter-btn" data-cat="storage">高压存储</button>
  <button class="filter-btn" data-cat="habitat">生活区</button>
  <button class="filter-btn" data-cat="recreation">娱乐区</button>
  <button class="filter-btn" data-cat="rocket">火箭</button>
  <button class="filter-btn" data-cat="geothermal">地热</button>
</nav>

<section class="id-index" id="module-id-index">
  <details>
    <summary>模块 ID 对照表 <span class="id-index-hint">点击展开 · 把 id 发给助手即可定位模块</span></summary>
    <div class="id-index-body" id="id-index-body"></div>
  </details>
</section>

<main class="card-grid" id="card-grid">
  <!-- JS 渲染模块卡片 -->
</main>

<footer class="site-footer" id="page-footer">
  <p>点击卡片进入模块详情页 · 卡片底部可一键复制模块 id · 数据来源 <code>data/modules.js</code> · 编辑后刷新即可 · 线上更新需 commit → push</p>
</footer>

<script src="data/modules.js"></script>
<script src="assets/id-copy.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
